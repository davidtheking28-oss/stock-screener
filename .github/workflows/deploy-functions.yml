name: Deploy Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

jobs:
  # Gate for the deploy: without this, a broken edge function only surfaces
  # once it's live and something calls it — deploy-functions had no test at
  # all before this, unlike deploy.yml's client suite. Mirrors the journal's
  # own Deno test job (deploy.yml there).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Run edge function unit tests
        run: deno test --allow-net supabase/functions/_shared/ supabase/functions/daily-scan/

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: fnklrqxwyeibfptaxewf
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          # Pinned, not "latest": resolving "latest" costs an unauthenticated
          # GitHub releases API call from a shared runner IP, which fails the
          # whole deploy with "rate limit exceeded" - hit twice on 2026-08-23,
          # including on a re-run. Bump this deliberately.
          version: 2.115.0

      - name: Deploy functions
        run: |
          supabase functions deploy scan-universe --project-ref "$PROJECT_REF"
          supabase functions deploy ohlc --project-ref "$PROJECT_REF"
          supabase functions deploy daily-scan --project-ref "$PROJECT_REF"
