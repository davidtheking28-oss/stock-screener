name: Deploy Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: fnklrqxwyeibfptaxewf
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          # Pinned, not "latest": resolving "latest" costs an unauthenticated
          # GitHub releases API call from a shared runner IP, which fails the
          # whole deploy with "rate limit exceeded" - hit twice on 2026-08-23,
          # including on a re-run. Bump this deliberately.
          version: 2.115.0

      - name: Deploy functions
        run: |
          supabase functions deploy scan-universe --project-ref "$PROJECT_REF"
          supabase functions deploy ohlc --project-ref "$PROJECT_REF"
          supabase functions deploy daily-scan --project-ref "$PROJECT_REF"
